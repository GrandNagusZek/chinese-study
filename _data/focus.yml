- id: complements
  title: "出来、起来、通、开"
  summary: "同一个动词后面，这几个补语并不互换。"
  status: active
  since: "2026-10-18"
  notes: |
    以「想」为例：这道题我想了半天也没想\_\_\_。

    - **想出来**：答案或办法被想了出来。这个空里最贴。
    - **想通**：原先拧着的道理想明白了。这个空里也说得通。
    - **想开**：情绪上放下，不是把题目做出来。意思变了。
    - **想起来**：回忆起忘掉的事。意思变了。
    - **没想到**：通常是「没预料到」，不是这个空要的补语。

    出来、起来是趋向补语。通、开在这里是结果补语。

- id: health-collocations
  title: "「健康」不要配「提高」"
  summary: "提高跟可以衡量的事物走；健康用促进、增进、有益于。"
  status: active
  since: "2026-10-18"
  notes: |
    「提高」搭配水平、能力、效率这一类可以衡量的事物。

    健康不说「提高健康」。要说促进健康、增进健康、有益于健康，或者「对健康有好处」。

    书面一点可以说强身健体。泛泛的「你的气」像把英语 your qi 直接搬过来，这里说「气」或「内气」就够。

- id: chulai
  title: "出来：逼出来、想出来"
  summary: "出来是结果呈现出来；起来常常是另一件事。"
  status: active
  since: "2026-11-08"
  notes: |
    第一课追踪的薄弱点是趋向补语和结果补语。那一课的空是「想出来」，容易写成「想起来」。第二课「被……逼出来」还是这个出来。

    出来：原先没有的、或不明显的东西，变得看得见。

    - **逼出来**：压力把一项能力逼得显出来。
    - **想出来**：答案或办法被想了出来。
    - **看出来**：原先没看明白的一点，看明白了。
    - **做出来**：做成一个拿得出来的结果。

    起来不跟这四个互换。想起来是回忆；站起来、哭起来是起始或向上。

    见「第二课：算命里的书面语」。

- id: written-register
  title: "书面语：非……无以……、正是在……中"
  summary: "非……无以……和正是在……中，都是文言味的书面句式。"
  status: active
  since: "2026-11-08"
  notes: |
    **非……无以……**是文言句式，意思是「不……，就没有办法……」。诸葛亮《诫子书》：「非淡泊无以明志，非宁静无以致远」。

    无以是「没有用来做这件事的办法」，几乎只留在这种句子里。白话说无法、没法、很难。前半句的白话：如果放不下名利，就很难明确自己真正的志向。

    **正是在……中，……才……**把事情发生的那段环境强调出来。正是在解决问题的过程中，才发现自己有这项能力。

    见「第二课：算命里的书面语」。
