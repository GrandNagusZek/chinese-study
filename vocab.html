---
layout: default
title: 词汇
permalink: /vocab/
script: vocab
---
<header class="page-head">
  <h1>词汇</h1>
  <p class="summary">默认是课文生词和他自己存的 Pleco 词。HSK 词表在筛选里打开。拼音搜索可以不带声调。</p>
</header>

<div class="vocab-tools">
  <label class="search-label" for="vocab-search">搜索</label>
  <input id="vocab-search" type="search" placeholder="汉字、拼音或英文" autocomplete="off">
  <div class="tag-filters" role="group" aria-label="来源">
    <button type="button" data-source="lesson" aria-pressed="true">课文</button>
    <button type="button" data-source="saved" aria-pressed="true">Pleco 自存</button>
    <button type="button" data-source="hsk" aria-pressed="false">Pleco HSK</button>
  </div>
  <div class="tag-filters" id="hsk-levels" role="group" aria-label="HSK 级别" hidden>
    <button type="button" data-level="1" aria-pressed="true">HSK 1</button>
    <button type="button" data-level="2" aria-pressed="true">HSK 2</button>
    <button type="button" data-level="3" aria-pressed="true">HSK 3</button>
    <button type="button" data-level="4" aria-pressed="true">HSK 4</button>
    <button type="button" data-level="5" aria-pressed="true">HSK 5</button>
    <button type="button" data-level="6" aria-pressed="true">HSK 6</button>
  </div>
  <p class="vocab-count" id="vocab-count" aria-live="polite">正在载入…</p>
</div>

<div class="table-scroll">
  <table id="vocab-table">
    <caption class="visually-hidden">生词</caption>
    <thead>
      <tr>
        <th scope="col"><button type="button" data-sort="hanzi">汉字</button></th>
        <th scope="col"><button type="button" data-sort="trad">繁体</button></th>
        <th scope="col"><button type="button" data-sort="pinyin">拼音</button></th>
        <th scope="col"><button type="button" data-sort="gloss">意思</button></th>
        <th scope="col"><button type="button" data-sort="date">日期</button></th>
        <th scope="col"><button type="button" data-sort="source">来源</button></th>
      </tr>
    </thead>
    <tbody id="vocab-body"></tbody>
  </table>
</div>
<nav class="pager" id="vocab-pager" aria-label="翻页" hidden>
  <button type="button" class="secondary" id="page-prev">上一页</button>
  <span id="page-status"></span>
  <button type="button" class="secondary" id="page-next">下一页</button>
</nav>
<p class="empty" id="vocab-empty" hidden>没有符合的生词。</p>
<p class="empty" id="vocab-status"></p>

<script id="vocab-boot" type="application/json">
{
  "pleco": {{ '/data/pleco.json' | relative_url | jsonify }},
  "words": {{ site.data.vocab | jsonify | replace: "<", "\u003c" }},
  "lessons": {
    {% for lesson in site.lessons %}
    {{ lesson.lesson_id | jsonify }}: {
      "title": {{ lesson.title | jsonify | replace: "<", "\u003c" }},
      "url": {{ lesson.url | relative_url | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  }
}
</script>

<noscript>
  <p class="empty">筛选和 Pleco 词库需要 JavaScript。课文生词：</p>
  <ul>
    {% for word in site.data.vocab %}
    <li><span class="hanzi">{{ word.hanzi }}</span> <span class="pinyin">{{ word.pinyin }}</span> {{ word.gloss }}</li>
    {% endfor %}
  </ul>
</noscript>
